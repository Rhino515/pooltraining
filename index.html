<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#07111d"/>
  <meta name="description" content="Pool IQ — real-table billiards training, ghost matches, and career progression."/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <link rel="manifest" href="./manifest.json"/>
  <link rel="icon" href="./icons/icon-192.png"/>
  <link rel="apple-touch-icon" href="./icons/icon-192.png"/>
  <link rel="stylesheet" href="./css/styles.css"/>
  <title>Pool IQ</title>
</head>
<body>
<div id="app">
  <header>
    <div>
      <span class="brand">POOL <b>IQ</b></span>
      <small>TRAIN • ANALYZE • LEVEL UP</small>
    </div>
    <button id="resetBtn" class="ghost" type="button">Reset</button>
  </header>

  <main>
    <section id="home" class="page active"></section>
    <section id="career" class="page"></section>
    <section id="drills" class="page"></section>
    <section id="analyze" class="page"></section>
    <section id="ghost" class="page"></section>
    <section id="stats" class="page"></section>
  </main>

  <div id="drillModal" class="modal" aria-hidden="true">
    <div id="drillModalBody" class="modalBody card"></div>
  </div>
  <div id="ghostModal" class="modal" aria-hidden="true">
    <div id="ghostModalBody" class="modalBody card"></div>
  </div>
  <div id="ghostRacePicker" class="modal" aria-hidden="true">
    <div id="ghostRaceBody" class="modalBody card"></div>
  </div>

  <nav>
    <button type="button" data-page="home" class="active">⌂<span>Home</span></button>
    <button type="button" data-page="career">♜<span>Career</span></button>
    <button type="button" data-page="drills">◎<span>Drills</span></button>
    <button type="button" data-page="analyze" class="scan">◉<span>Analyze</span></button>
    <button type="button" data-page="ghost">♚<span>Ghost</span></button>
    <button type="button" data-page="stats">▥<span>Stats</span></button>
  </nav>
</div>
<script type="module" src="./js/app.js"></script>
</body>
</html>
