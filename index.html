<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#07111d"/>
  <meta name="description" content="Pool IQ — real-table billiards training, ghost matches, and career progression."/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <link rel="manifest" href="./manifest.json"/>
  <link rel="icon" href="./icons/icon-192.png"/>
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="Pool IQ"/>
  <link rel="stylesheet" href="./css/styles.css"/>
  <title>Pool IQ</title>
</head>
<body>
<div id="app">
  <header>
    <div>
      <span class="brand">POOL <b>IQ</b></span>
      <small>TRAIN • ANALYZE • LEVEL UP</small>
    </div>
    <button id="settingsBtn" class="ghost" type="button" data-action="go" data-href="#settings" aria-label="Settings">⚙ Settings</button>
  </header>

  <main>
    <section id="view" class="page active" aria-live="polite"></section>
  </main>

  <nav>
    <button type="button" data-page="home" data-action="go" data-href="#home" class="active">⌂<span>Home</span></button>
    <button type="button" data-page="career" data-action="go" data-href="#career">♜<span>Career</span></button>
    <button type="button" data-page="drills" data-action="go" data-href="#drills">◎<span>Drills</span></button>
    <button type="button" data-page="analyze" data-action="go" data-href="#analyze" class="scan">◉<span>Analyze</span></button>
    <button type="button" data-page="sim" data-action="go" data-href="#sim">◔<span>Simulator</span></button>
    <button type="button" data-page="arcade" data-action="go" data-href="#arcade">🎯<span>Arcade</span></button>
    <button type="button" data-page="profile" data-action="go" data-href="#profile">▥<span>Profile</span></button>
  </nav>
</div>
<script type="module" src="./js/app.js"></script>
</body>
</html>
